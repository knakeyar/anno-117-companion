name: anno-companion

services:
  anno-companion-data:
    image: anno-companion-data:local
    build:
      context: .
      dockerfile: services/data/Dockerfile
    init: true
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      ANNO_DATABASE_PATH: /data/anno-companion.sqlite3
      ANNO_TELEMETRY_DIR: /telemetry
      ANNO_TELEMETRY_GLOB: ${ANNO_TELEMETRY_GLOB:-*.log}
      ANNO_CATALOG_PATH: /app/catalog/anno117-community-2.1-c6a6e752.json
      ANNO_PLANNING_CATALOG_PATH: /app/catalog/anno117-community-2.1-c6a6e752-planning.json
      ANNO_POLL_INTERVAL_SECONDS: ${ANNO_POLL_INTERVAL_SECONDS:-1}
      ANNO_SNAPSHOT_INTERVAL_SECONDS: 30
      ANNO_STALE_AFTER_SECONDS: ${ANNO_STALE_AFTER_SECONDS:-75}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-low}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-30}
    volumes:
      - type: bind
        source: ${ANNO_LOG_DIR:-./runtime-data/telemetry}
        target: /telemetry
        read_only: true
      - type: bind
        source: ${ANNO_DATA_DIR:-./runtime-data/data}
        target: /data
    tmpfs:
      - /tmp:size=32m,mode=1777
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5

  anno-companion-dashboard:
    image: anno-companion-dashboard:local
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    init: true
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      anno-companion-data:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8080}:8080"
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=0755
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5
